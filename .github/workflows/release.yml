name: release

# Trigger: tag pushes matching v*.*.* (with optional -rcN / -alpha / -beta suffix
# for pre-releases). The release body is the annotated tag's message (notes.md),
# then GitHub's generated notes; a lightweight tag gets the generated notes only.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # softprops/action-gh-release needs this to publish

env:
  PIO_VERSION: 6.1.19

jobs:
  build:
    name: build ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The station image and the 802.11s mesh images, all region-agnostic (AT+REGION).
        # Each entry is the suffix of a pio env (warthog-<suffix>) and of the release asset name.
        variant: [station, mesh-smoke, mesh-sae-meshvif, mesh-sae-swccmp-meshvif]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 6.1.x wants the SCons 4.8.1 that pioarduino 55.03.38 installs; PlatformIO 6.2 adds SCons 4.11.1
      # beside it and the build dies on the mix (No module named 'SCons.Tool.FortranCommon').
      - name: Install PlatformIO
        run: pip install "platformio==${PIO_VERSION}"

      - name: Cache PlatformIO toolchain + packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ env.PIO_VERSION }}-${{ hashFiles('platformio.ini', 'main/idf_component.yml') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ env.PIO_VERSION }}-

      - name: Build warthog-${{ matrix.variant }}
        env:
          # Bakes the tag into the firmware so AT+VERSION? reports e.g. "v0.1.0".
          WARTHOG_VERSION: ${{ github.ref_name }}
        run: pio run -e warthog-${{ matrix.variant }}

      - name: Bundle variant artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          VARIANT="${{ matrix.variant }}"
          BUILD=".pio/build/warthog-${VARIANT}"
          STEM="warthog-${TAG}-${VARIANT}"
          cp "$BUILD/firmware.bin"         "dist/${STEM}.bin"
          cp "$BUILD/firmware.factory.bin" "dist/${STEM}.factory.bin"
          cp "$BUILD/firmware.elf"         "dist/${STEM}.elf"
          cp "$BUILD/bootloader.bin"       "dist/${STEM}-bootloader.bin"
          cp "$BUILD/partitions.bin"       "dist/${STEM}-partitions.bin"
          ( cd dist && sha256sum ${STEM}* > "${STEM}.SHA256SUMS" )
          ls -la dist/

      # One regnvs image per country the station build offers (CONFIG_WARTHOG_HW_REGIONS), for the
      # web flasher and flash.sh --region; each is checked to hold exactly warthog/region=<CC>.
      - name: Region NVS images
        if: matrix.variant == 'station'
        run: |
          set -euo pipefail
          # Its own venv: the generator's click must not move PlatformIO's.
          python -m venv "$RUNNER_TEMP/nvsgen"
          "$RUNNER_TEMP/nvsgen/bin/pip" install "esp-idf-nvs-partition-gen==0.3.0"
          TAG="${GITHUB_REF_NAME}"
          PYTHON="$RUNNER_TEMP/nvsgen/bin/python" scripts/region-images.sh "$TAG" dist
          ( cd dist && sha256sum warthog-${TAG}-region-*.bin > "warthog-${TAG}-region.SHA256SUMS" )
          ls -la dist/

      - name: Upload variant bundle
        uses: actions/upload-artifact@v4
        with:
          name: warthog-${{ matrix.variant }}
          path: dist/
          retention-days: 3
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # checkout leaves a tag event's ref lightweight; fetch the tag object to read its message.
      - name: Release notes from the tag message
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag ]; then
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "${GITHUB_REF_NAME}" > notes.md
          else
            : > notes.md
          fi
          cat notes.md

      - name: Download all variant bundles
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add flash.sh and consolidated SHA256SUMS
        run: |
          set -euo pipefail
          cp scripts/flash.sh dist/
          chmod +x dist/flash.sh
          ( cd dist && cat warthog-*.SHA256SUMS > SHA256SUMS.txt && rm warthog-*.SHA256SUMS )
          ls -la dist/

      - name: Detect pre-release
        id: prerel
        run: |
          # Tag has a `-` suffix (e.g. v0.1.0-rc1) → mark as pre-release.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          prerelease: ${{ steps.prerel.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
