name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # inject_version.py runs `git describe --tags`; shallow clones break it.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Seconds, and needs no embedded toolchain -- so it runs before the slow
      # PlatformIO steps and fails fast. Covers the mesh on-air byte layout
      # (IE construction, MPM frame build/parse) against a frame captured from
      # hardware. The SAN=1 pass is the one that detects an over-read in the
      # truncation/mutation sweeps; without it those tests prove very little.
      - name: Host unit tests (mesh byte layout)
        run: |
          make -C components/halow_mesh_compat/test clean all
          make -C components/halow_mesh_compat/test clean all SAN=1

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Cache PlatformIO toolchain + packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'main/idf_component.yml') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Smoke build (warthog-us)
        # One region is enough for CI — the others differ only in the
        # WARTHOG_REGION_XX define and the BCF/country pick that drives.
        run: pio run -e warthog-us

      # The mesh env is a different set of sources (probe responder, MPM,
      # datapath ops) behind WARTHOG_MESH_SMOKE, so warthog-us compiles none of
      # it. Without this, nothing in CI ever type-checks the mesh code.
      - name: Smoke build (warthog-mesh-smoke)
        run: pio run -e warthog-mesh-smoke

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warthog-us-${{ github.sha }}
          path: |
            .pio/build/warthog-us/firmware.bin
            .pio/build/warthog-us/firmware.factory.bin
            .pio/build/warthog-us/firmware.elf
            .pio/build/warthog-us/bootloader.bin
            .pio/build/warthog-us/partitions.bin
          retention-days: 14
          if-no-files-found: error
