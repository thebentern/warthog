name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  PIO_VERSION: 6.1.19

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # inject_version.py runs `git describe --tags`; shallow clones break it.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # make all runs the web flasher's script under node (test_flasher.mjs) and fails without it in CI.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Seconds, and needs no embedded toolchain -- so it runs before the slow
      # PlatformIO steps and fails fast. Covers the mesh on-air byte layout
      # (IE construction, MPM frame build/parse) against a frame captured from
      # hardware. The SAN=1 pass is the one that detects an over-read in the
      # truncation/mutation sweeps; without it those tests prove very little.
      - name: Host unit tests (mesh byte layout)
        run: |
          make -C components/halow_mesh_compat/test clean all
          make -C components/halow_mesh_compat/test clean all SAN=1

      # batvm_node, the VM interop harness, drives the batman engine through its public API,
      # but it is Linux-only and runs only as root against batman-adv, so the host tests never
      # build it. Compiling it here, plain and ASan/UBSan, with -Werror is what fails an engine
      # API change the harness missed. Nothing runs. The lint keeps batctl output quoted.
      - name: Batman VM harness (compile and lint only)
        run: |
          make -C components/halow_mesh_compat/test/batman_vm clean all WERROR=1
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          make -C components/halow_mesh_compat/test/batman_vm lint

      # 6.1.x wants the SCons 4.8.1 that pioarduino 55.03.38 installs; PlatformIO 6.2 adds SCons 4.11.1
      # beside it and the build dies on the mix (No module named 'SCons.Tool.FortranCommon').
      - name: Install PlatformIO
        run: pip install "platformio==${PIO_VERSION}"

      - name: Cache PlatformIO toolchain + packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ env.PIO_VERSION }}-${{ hashFiles('platformio.ini', 'main/idf_component.yml') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ env.PIO_VERSION }}-

      # One station image serves every region (AT+REGION at runtime); test_region covers the countries.
      - name: Smoke build (warthog-station)
        run: pio run -e warthog-station

      # The CDC-ECM fallback (sdkconfig.ecm): main/usb_net.c's ECM side compiles only here. esp_tinyusb's
      # default descriptor has no ECM function, so the ELF must hold usb_net.c's CDC + ECM one.
      - name: Smoke build (warthog-station-ecm)
        run: |
          pio run -e warthog-station-ecm
          ~/.platformio/packages/toolchain-xtensa-esp-elf/bin/xtensa-esp32s3-elf-nm -S .pio/build/warthog-station-ecm/firmware.elf | grep ' 0000009a [dr] s_desc_fs_config$'

      # release.yml's region images, from the station build's sdkconfig with the same pinned generator.
      - name: Region NVS images
        run: |
          python -m venv "$RUNNER_TEMP/nvsgen"
          "$RUNNER_TEMP/nvsgen/bin/pip" install "esp-idf-nvs-partition-gen==0.3.0"
          PYTHON="$RUNNER_TEMP/nvsgen/bin/python" scripts/region-images.sh ci "$RUNNER_TEMP/region"

      # The glue guard again: its checks of the generated sdkconfig.warthog-* files found none in a fresh
      # checkout, and the two builds above have now written warthog-station's and warthog-station-ecm's.
      - name: Glue guard (generated sdkconfigs)
        run: make -C components/halow_mesh_compat/test glueguard

      # IDF's own lwIP with main/nat_frag.c (lwip_napt.mk): IP fragments, reassembly and NAPT. The
      # host tests above skip it, since it builds from the ESP-IDF package the build just fetched.
      - name: Host tests (IDF lwIP, IP fragments and NAPT)
        run: |
          make -C components/halow_mesh_compat/test lwip-napt LWIP_NAPT_REQUIRED=1
          make -C components/halow_mesh_compat/test clean lwip-napt SAN=1 LWIP_NAPT_REQUIRED=1

      # TinyUSB's own NCM and ECM class drivers with main/usbnet_core.c (usbnet.mk): one owner of the
      # USB network class. Built from the managed_components/ the build just fetched.
      - name: Host tests (TinyUSB NCM/ECM, USB network class)
        run: |
          make -C components/halow_mesh_compat/test usbnet USBNET_REQUIRED=1
          make -C components/halow_mesh_compat/test clean usbnet SAN=1 USBNET_REQUIRED=1

      # warthog-station compiles the mesh sources too (mesh is a runtime switch). This
      # env adds the code behind its own flags: the RX tap and the USB devloop helpers.
      - name: Smoke build (warthog-mesh-smoke)
        run: pio run -e warthog-mesh-smoke

      # WARTHOG_MESH_SAE, which starts the mesh with SAE/AMPE, is set only in the
      # mesh-sae envs, and release.yml ships this one.
      - name: Smoke build (warthog-mesh-sae)
        run: pio run -e warthog-mesh-sae

      # Host software CCMP (WARTHOG_MESH_HOST_CCMP) is compiled only in the swccmp envs.
      - name: Smoke build (warthog-mesh-sae-swccmp)
        run: pio run -e warthog-mesh-sae-swccmp

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: warthog-station-${{ github.sha }}
          path: |
            .pio/build/warthog-station/firmware.bin
            .pio/build/warthog-station/firmware.factory.bin
            .pio/build/warthog-station/firmware.elf
            .pio/build/warthog-station/bootloader.bin
            .pio/build/warthog-station/partitions.bin
          retention-days: 14
          if-no-files-found: error
