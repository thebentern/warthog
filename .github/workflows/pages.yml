# Publish the web flasher to GitHub Pages.
#
# The flasher imports esptool-js at runtime. Mirror public firmware release
# assets beside it so the browser can fetch them from the same origin.
# Pages must be set to "GitHub Actions" as its source once, in repo settings.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'web-flasher/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; let it settle and run the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Mirror public firmware releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          firmware=web-flasher/firmware
          mkdir -p "$firmware"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq '
              flatten | map(select(.draft == false)) | .[:20] |
              map(
                .tag_name as $tag |
                select($tag | test("^[A-Za-z0-9][A-Za-z0-9._+~-]*$")) |
                {
                  tag_name, prerelease, draft,
                  assets: [.assets[] |
                    select(.state == "uploaded") |
                    select(.name | startswith("warthog-\($tag)-")) |
                    select(.name | test("^[A-Za-z0-9._+~-]+$")) |
                    select(.name | endswith(".factory.bin") or test("-region-[A-Z]{2}\\.bin$")) |
                    {name, size, browser_download_url}
                  ]
                } |
                select(.assets | length > 0)
              )
            ' > "$firmware/releases.json"

          jq -r '.[] | .tag_name as $tag | .assets[] |
            [$tag, .name, .size, .browser_download_url] | @tsv' \
            "$firmware/releases.json" > "$RUNNER_TEMP/firmware-assets.tsv"
          while IFS=$'\t' read -r tag name size url; do
            target="$firmware/$tag/$name"
            mkdir -p "$firmware/$tag"
            curl --fail --silent --show-error --location --retry 3 --output "$target" "$url"
            actual=$(wc -c < "$target")
            if (( actual != size )); then
              echo "$name: expected $size bytes, downloaded $actual" >&2
              exit 1
            fi
          done < "$RUNNER_TEMP/firmware-assets.tsv"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-flasher
      - id: deployment
        uses: actions/deploy-pages@v4
