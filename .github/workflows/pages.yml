# Publish the web flasher to GitHub Pages.
#
# The flasher is a single static file with no build step -- it imports
# esptool-js from a CDN at runtime -- so this just uploads web-flasher/ as-is.
# Pages must be set to "GitHub Actions" as its source once, in repo settings.
name: pages

on:
  push:
    branches: [main]
    paths:
      - 'web-flasher/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a half-finished deploy; let it settle and run the next one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-flasher
      - id: deployment
        uses: actions/deploy-pages@v4
