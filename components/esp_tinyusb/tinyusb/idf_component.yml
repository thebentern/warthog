description: TinyUSB as esp-idf component
url: https://docs.tinyusb.org/en/latest/
documentation: "https://docs.tinyusb.org/en/latest/"
repository: "https://github.com/espressif/tinyusb.git"
issues: "https://github.com/hathach/tinyusb/issues"
dependencies:
  idf: '>=5.0'
files:
  exclude:
    - "docs/**/*"
    - "tools/**/*"
    - "lib/embedded-cli/**/*"
    - "lib/SEGGER_RTT/**/*"
targets:
  - esp32s2
  - esp32s3
  - esp32p4
  - esp32h4
  - esp32s31
tags:
  - usb
  - usb_device
sbom:
  supplier: 'Organization: Espressif Systems (Shanghai) CO LTD'
  originator: 'Person: Ha Thach <thach@tinyusb.org>'
