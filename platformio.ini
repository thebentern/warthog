; Warthog — USB Ethernet (CDC-ECM) + Wi-Fi AP ↔ Wi-Fi HaLow bridge firmware.
; (RNDIS is not implemented; esp_tinyusb allows only one configuration.)
;
; One env per region. The region's BCF + country code are picked at compile
; time via WARTHOG_REGION_<XX> defines; runtime swapping isn't safe (TX power
; and channel masks differ by jurisdiction, and the BCF is linked into the
; firmware).

[platformio]
default_envs = warthog-us
; ESP-IDF projects use main/ for the main component, not the PlatformIO default
; src/. Point PlatformIO at main/ so both build systems see the same dir.
src_dir = main

; -----------------------------------------------------------------------------
; Shared base — anything region-independent lives here.
; -----------------------------------------------------------------------------
[warthog_base]
; pioarduino's espressif32 fork ships ESP-IDF 5.5+, which is what
; `morsemicro/halow` 2.9.7-esp32-3+ requires (>= 5.4.2). The official
; platformio/espressif32 platform is stuck on IDF 5.1.4.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = espidf
board = seeed_xiao_esp32s3

; pre_build_morselib.py — works around PlatformIO + morselib build-order bugs
;   (PIO's section-scanner runs `objdump -h` on every .a before CMake's
;   custom command produces the mangled libmorse.a). See docs/fork-inventory.md.
; inject_version.py — bakes WARTHOG_VERSION from $WARTHOG_VERSION or git describe.
extra_scripts =
  pre:scripts/inject_version.py
  pre:scripts/pre_build_morselib.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 8 MB flash + single-app-large partition. The IDF Kconfig
; (CONFIG_PARTITION_TABLE_SINGLE_APP_LARGE in sdkconfig.defaults) selects the
; layout; here we just have to teach PlatformIO/board JSON the right flash size
; so it doesn't reject the resulting image as too big for a 2 MB device.
board_build.flash_size = 8MB
board_build.flash_mode = dio
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

build_flags =
  ; WARTHOG_VERSION is injected at build time by scripts/inject_version.py.
  -DWARTHOG_AP_SSID=\"warthog\"
  -DWARTHOG_AP_PSK=\"warthog-default\"
  ; USB net subnet (host gets .2+, ESP32 = .1)
  -DWARTHOG_USB_GW_IP=\"192.168.4.1\"
  -DWARTHOG_USB_NETMASK=\"255.255.255.0\"
  ; Wi-Fi AP subnet
  -DWARTHOG_AP_GW_IP=\"192.168.5.1\"
  -DWARTHOG_AP_NETMASK=\"255.255.255.0\"
  ; DNS the downstream DHCP servers (USB ECM + Wi-Fi AP) hand out to clients.
  ; 1.1.1.1 (Cloudflare) is reachable through any NAT chain; LAN-side DNS
  ; (e.g. the upstream HaLow AP's resolver) often isn't, because we NAPT
  ; through HaLow and the LAN resolver only listens on its own subnet.
  ; Override at build time if you prefer 8.8.8.8 or a private resolver.
  -DWARTHOG_DOWNSTREAM_DNS=\"1.1.1.1\"
  ; HaLow STA credentials. Empty SSID means "chip boots and idles" — set via
  ; -DHALOW_SSID=\"...\" at command line or in a platformio_override.ini for
  ; bench testing. Production builds inject these from CI secrets.
  -DHALOW_SSID=\"\"
  -DHALOW_PASSPHRASE=\"\"

; -----------------------------------------------------------------------------
; Per-region envs. Each one picks the right BCF + country code via region.h.
; -----------------------------------------------------------------------------
[env:warthog-us]
extends = warthog_base
build_flags =
  ${warthog_base.build_flags}
  -DWARTHOG_REGION_US=1

; Mesh firmware-capability diagnostic. Boots the MM6108, calls
; mmwlan_mesh_enable() once, logs whether the chip accepts a mesh VIF, then
; idles (no STA association). Flash this, read the serial log: the result
; gates Phases 3-6 of the mesh port. See docs/history/mesh-port-scope.md.
;   pio run -e warthog-mesh-smoke -t upload && pio device monitor
[env:warthog-mesh-smoke]
extends = warthog_base
build_flags =
  ${warthog_base.build_flags}
  -DWARTHOG_REGION_US=1
  -DWARTHOG_MESH_SMOKE=1
  ; Pin the radio to ONE S1G channel so an external radio (Linux morse_driver
  ; on the MM8108 USB adapter) can be tuned to exactly our channel to sniff or
  ; peer. S1G ch5 = 904.5 MHz, which the dot11ah S1G<->11n mapping presents to
  ; Linux as 5 GHz channel 36 (5180 MHz). Chosen because the MM8108 accepts it
  ; (it rejects S1G ch1 @ 5660 and ch13 @ 5260). Applied in mmhalow_init(),
  ; before mmwlan_boot() -- see components/halow/mmhalow.c.
  -DWARTHOG_PIN_S1G_CHAN=42
  -DWARTHOG_PIN_S1G_FREQ_HZ=923000000
  -DWARTHOG_PIN_S1G_GLOBAL_OP_CLASS=69
  -DWARTHOG_PIN_S1G_OP_CLASS=2
  -DWARTHOG_PIN_S1G_BW_MHZ=2
  -DWARTHOG_MESH_ID='"halowmesh"'
  ; 802.11s security. 0 = open (matches stock OpenMANET, which ships
  ; encryption='none'); 1 = SAE authentication + AMPE key exchange, the real
  ; thing. The passphrase must be identical on every node in the mesh.
  -DWARTHOG_MESH_BEACON_TU=1000
  ; OpenMANET parity: their default is S1G ch42 = 923.0 MHz at 2 MHz, global
  ; operating class 69 / s1g class 2 (the US row in mmregdb.c). Swap the four
  ; lines above/below together -- class and bandwidth belong to the channel,
  ; and a mismatched class peers with nothing while looking like a radio
  ; fault. To build for interop testing against an OpenMANET node:
  ;   -DWARTHOG_PIN_S1G_CHAN=42
  ;   -DWARTHOG_PIN_S1G_FREQ_HZ=923000000
  ;   -DWARTHOG_PIN_S1G_GLOBAL_OP_CLASS=69
  ;   -DWARTHOG_PIN_S1G_OP_CLASS=2
  ;   -DWARTHOG_PIN_S1G_BW_MHZ=2
  ; ...and the mesh profile they match on:
  ;   -DWARTHOG_MESH_ID='\"halowmesh\"'   (their wizard default)
  ;   -DWARTHOG_MESH_BEACON_TU=1000        (Morse/OpenMANET use 1000, not 100)
  ; Their side also needs loosening for a first contact: encryption=none (we
  ; have no SAE yet), mesh_rssi_threshold=0 (they default -85 and will refuse a
  ; weak peer one-way), and mbca_config=0 (MBCA is a Morse extension, not
  ; 802.11s). Set those in /etc/config/mesh11sd -- iw changes are reverted
  ; within 10 s by mesh11sd.
  ; Pre-BSSID-filter RX tap. mmwlan_register_rx_frame_cb() fires downstream of
  ; the unknown-sender/BSSID drops in umac_datapath_rx_frame_filter(), so peer
  ; mesh frames die before any public hook sees them. This logs every frame at
  ; the earliest point in the host datapath.
  -DWARTHOG_MESH_RX_TAP=1
  ; EXPERIMENT: pre-register a peer STA with the chip at mesh start, to test
  ; whether the MM6108 gates mesh RX on its STA table (warthog never calls
  ; mmdrv_update_sta_state; the working reference always does). Bytes below =
  ; the sibling warthog board observed in RXTAP during the boot scan.
  ; EXPERIMENT: pre-register a peer STA with the chip at mesh start.
  ; Tests whether the MM6108 gates mesh RX on its STA table (warthog never
  ; calls mmdrv_update_sta_state; the working reference always does).
  ; MAC below = the sibling warthog board seen in RXTAP during boot scan.
  ; Use our own MAC as the mesh BSSID, matching mac80211 (bss_conf.bssid =
  ; vif->addr for mesh) and the working ESP32 mesh port. The old derived
  ; "shared BSSID" guarantees an Addr3 mismatch with any real 802.11s peer.
  ; Dev-only USB devloop helpers — gated by WARTHOG_DEVLOOP so they don't
  ; ship in region/release builds. Includes:
  ;   - 1200bps SET_LINE_CODING watchdog → ROM download mode
  ;   - DTR/RTS state-machine matching esptool's --before default_reset
  ;   - Verbose CDC line-coding / line-state logging
  ; Production builds keep AT+DLMODE as the only host-side reflash trigger
  ; (explicit AT command, no accident risk) plus the unique MAC-based USB
  ; iSerial (a feature, not a hazard).
  -DWARTHOG_DEVLOOP=1
  ; Phase 5c sub-flag — the DTR/RTS callback breaks USB-OTG init (chip stays
  ; in ROM USB-Serial-JTAG mode, never switches to TinyUSB). Root cause not
  ; yet identified — suspect either (a) macOS sends an enumeration-time
  ; SET_CONTROL_LINE_STATE that races the grace check, or (b) the callback
  ; runs in an unexpected context (ISR?) and crashes early. Verified by
  ; bisection: registering `.callback_line_state_changed` alone causes the
  ; failure; with WARTHOG_DEVLOOP=1 + WARTHOG_DEVLOOP_DTRRTS=0 the boards
  ; boot cleanly and the 1200bps watchdog still works. Re-enable once root
  ; cause is identified.
  -DWARTHOG_DEVLOOP_DTRRTS=0
  ; NB: morselib's MMLOG defaults to ERR, so MMLOG_INF/_WRN compile to
  ; printf_blackhole. We do NOT raise it globally (-DMMLOG_LEVEL_DEFAULT) —
  ; that pulls log-only helpers like mm_hexdump into files such as
  ; umac_datapath.c that the component packaging never links. Instead the
  ; mesh sources set MMLOG_LEVEL_OVRD per-file (see umac_mesh.c).

[env:warthog-eu]
extends = warthog_base
build_flags =
  ${warthog_base.build_flags}
  -DWARTHOG_REGION_EU=1

[env:warthog-jp]
extends = warthog_base
build_flags =
  ${warthog_base.build_flags}
  -DWARTHOG_REGION_JP=1

[env:warthog-kr]
extends = warthog_base
build_flags =
  ${warthog_base.build_flags}
  -DWARTHOG_REGION_KR=1

[env:warthog-au]
extends = warthog_base
build_flags =
  ${warthog_base.build_flags}
  -DWARTHOG_REGION_AU=1

; -----------------------------------------------------------------------------
; Host-side unit tests. Pure logic only — anything that touches IDF/Wi-Fi/USB
; must be guarded with #ifdef UNIT_TEST so the native compile doesn't see it.
; -----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
  -std=gnu++17
  -DUNIT_TEST
  -Imain

[env:warthog-us-ecm]
; CDC-ECM instead of the default CDC-NCM.
;
; Fallback only. NCM is bound in-box by macOS, Linux, Windows 10+ and
; iOS/iPadOS; ECM reaches only macOS and Linux. Use this if you meet a host
; that binds ECM and not NCM.
extends = env:warthog-us
build_flags =
  ${env:warthog-us.build_flags}
  -DWARTHOG_USB_NET_ECM=1
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ecm"

[env:warthog-mesh-sae]
; 802.11s mesh with REAL security: SAE authentication + AMPE key exchange.
;
; SAE (dragonfly) derives a PMK per peer from a shared passphrase; AMPE then
; carries the per-link MTK and the group MGTK inside the peering handshake,
; protected with AES-SIV. This is hostap's own mesh_rsn.c -- the same code
; wpa_supplicant runs -- so it is the mode that can interoperate with a
; secured OpenMANET / OpenWrt mesh.
;
; The passphrase must be identical on every node. Override it:
;   pio run -e warthog-mesh-sae --build-flag='-UWARTHOG_MESH_PASSPHRASE' \
;                               --build-flag='-DWARTHOG_MESH_PASSPHRASE=\"secret\"'
;
; warthog-mesh-smoke remains the OPEN build, which is what stock OpenMANET
; ships (encryption='none') and what it must be matched with.
extends = env:warthog-mesh-smoke
build_flags =
  ${env:warthog-mesh-smoke.build_flags}
  -DWARTHOG_MESH_SAE=1
