## Warthog — managed component dependencies.
##
## Both are vendored under components/ (override_path); nothing is fetched from the registry.
dependencies:
  idf:
    version: ">=5.5.4,<6.0"
  morsemicro/halow:
    # override_path builds the fork; version is provenance only.
    version: "2.11.2-esp32-2"
    # Local fork: adds an 802.11s mesh mode (umac/mesh/) the registry build
    # lacks. The fork is esp-halow main @4e9ba9b855 (2.11.2-esp32-2 + 6 commits;
    # mm-iot-sdk 2.12.3; morse-firmware ea18605f), stripped.
    # See docs/history/mesh-port-scope.md / mesh-port-audit.md.
    # Directory is named `halow` (the dependency short name) so the IDF
    # component graph resolves `main`'s `REQUIRES halow` to the fork.
    override_path: "../components/halow"
  espressif/esp_tinyusb:
    # override_path builds the vendored copy; version is provenance only.
    # Bundles TinyUSB 0.21.0~2: iOS NCM needs >=0.21.0 (hathach/tinyusb#3630); Windows since
    # KB5124008 refuses 0.21.0~1's NTB divisor of 1.
    version: "==3.0.0"
    # Vendored 2026-11-11: the registry's 3.0.0 (component_hash 0ff29f6113c4..., files as its
    # CHECKSUMS.json lists them) minus test_apps and TinyUSB's repository tooling, with two
    # changes: include/tusb_config.h sets CFG_TUD_DWC2_DMA_ENABLE to 0, and tusb.c's
    # tu_edpt_stream_write_xfer() sends one packet per transfer (lines marked "Warthog H6"). The
    # Buffer DMA driver stops the USB function when the console port is opened and closed under
    # network load, and the slave mode driver stalls the console on replies longer than one packet
    # (docs/test-sweep-2026-11-10.md, H6); a managed component cannot carry the edits, since the
    # component manager restores the files at the next configure.
    # Directory is named `esp_tinyusb` (the dependency short name) so `main`'s
    # `REQUIRES esp_tinyusb` resolves to it.
    override_path: "../components/esp_tinyusb"
